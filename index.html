<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng dụng Chấm công Cá nhân</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f3f4f6; }
        button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-start p-3 pb-12">

    <!-- Chấm công nhanh hôm nay -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-lg p-4 mb-4">
        <div class="text-center mb-3 bg-gray-50 p-2.5 rounded-2xl border border-gray-100">
            <span class="text-[11px] font-semibold text-gray-500 uppercase">Thời gian hiện tại</span>
            <div id="live-clock" class="text-xl font-extrabold text-indigo-600 mt-0.5">00:00:00</div>
        </div>

        <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-3 text-center mb-3">
            <span class="text-[11px] font-semibold uppercase tracking-wider text-indigo-600">Tổng công tích lũy</span>
            <div id="total-work-display" class="text-2xl font-extrabold text-indigo-700 mt-0.5">0 công</div>
        </div>

        <div class="mb-3">
            <label class="block text-xs font-medium text-gray-500 mb-1">Loại công hôm nay:</label>
            <select id="quick-work-type" class="w-full bg-gray-50 border border-gray-200 rounded-2xl py-2.5 px-3 text-xs font-bold text-gray-700">
                <option value="1">1 công (Đủ ngày)</option>
                <option value="0.5">0.5 công (Nửa ngày)</option>
                <option value="0">0 công (Nghỉ)</option>
            </select>
        </div>

        <div class="grid grid-cols-2 gap-2">
            <button onclick="quickCheckIn()" class="bg-emerald-500 text-white font-bold py-3 px-2 rounded-2xl shadow-md text-xs">Vào Làm (Hôm Nay)</button>
            <button onclick="quickCheckOut()" class="bg-rose-500 text-white font-bold py-3 px-2 rounded-2xl shadow-md text-xs">Tan Làm (Hôm Nay)</button>
        </div>
    </div>

    <!-- Chấm công ngày bất kỳ / Sửa công -->
    <div id="custom-section" class="w-full max-w-md bg-white rounded-3xl shadow-lg p-4 mb-4 border-2 border-indigo-100">
        <h2 id="form-title" class="text-base font-bold text-indigo-600 mb-2">Chấm công / Sửa ngày bất kỳ</h2>
        
        <div class="grid grid-cols-2 gap-2 mb-2">
            <div>
                <label class="block text-xs font-medium text-gray-500 mb-1">Ngày:</label>
                <input type="date" id="custom-date" class="w-full bg-gray-50 border border-gray-200 rounded-2xl py-2.5 px-2 text-xs font-bold text-gray-700">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-500 mb-1">Tính Công:</label>
                <select id="custom-work-type" class="w-full bg-gray-50 border border-gray-200 rounded-2xl py-2.5 px-2 text-xs font-bold text-gray-700">
                    <option value="1">1 công</option>
                    <option value="0.5">0.5 công</option>
                    <option value="0">0 công</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-2 mb-3">
            <div>
                <label class="block text-xs font-medium text-gray-500 mb-1">Giờ Vào:</label>
                <input type="time" id="custom-check-in" value="08:00" class="w-full bg-gray-50 border border-gray-200 rounded-2xl py-2.5 px-2 text-center text-xs font-bold text-gray-700">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-500 mb-1">Giờ Về:</label>
                <input type="time" id="custom-check-out" value="17:00" class="w-full bg-gray-50 border border-gray-200 rounded-2xl py-2.5 px-2 text-center text-xs font-bold text-gray-700">
            </div>
        </div>

        <button onclick="saveCustomDay()" class="w-full bg-indigo-600 text-white font-bold py-3 px-3 rounded-2xl shadow-md text-xs">Lưu Ngày Đã Chọn</button>
    </div>

    <!-- Bảng công chi tiết -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-lg p-4">
        <h2 class="text-base font-bold text-gray-800 mb-2">Bảng công chi tiết</h2>
        
        <div class="overflow-x-auto mb-3">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-gray-100 text-gray-400 text-[10px] font-semibold uppercase">
                        <th class="py-2 px-1 w-[30%]">Ngày</th>
                        <th class="py-2 px-1 w-[18%]">Vào</th>
                        <th class="py-2 px-1 w-[18%]">Về</th>
                        <th class="py-2 px-1 w-[12%]">Công</th>
                        <th class="py-2 px-1 text-center w-[22%]">Hành động</th>
                    </tr>
                </thead>
                <tbody id="records-table-body" class="text-xs text-gray-700 divide-y divide-gray-50"></tbody>
            </table>
        </div>

        <button onclick="exportCSV()" class="w-full bg-blue-500 text-white font-semibold py-2.5 px-3 rounded-2xl shadow-sm mb-2.5 text-xs">Xuất file Excel (CSV)</button>
        <button onclick="changeUserCode()" class="w-full bg-slate-600 text-white text-[11px] font-medium py-2.5 px-3 rounded-2xl text-center">Mã của bạn: <span id="user-code-span">12345</span> (Đổi mã)</button>
        <p id="cloud-status" class="text-center text-[11px] text-gray-400 mt-2 italic">Trạng thái: Sẵn sàng</p>
    </div>

    <!-- Modal Lịch sử -->
    <div id="history-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl">
            <h3 class="text-base font-bold text-gray-800 mb-1">Lịch sử chỉnh sửa</h3>
            <p id="modal-date-title" class="text-xs font-semibold text-indigo-600 mb-3"></p>
            <div id="modal-history-content" class="bg-gray-50 border border-gray-100 rounded-2xl p-3 text-xs text-gray-600 max-h-48 overflow-y-auto space-y-2 mb-4"></div>
            <button onclick="closeHistoryModal()" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl text-xs">Đóng</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLeHR_Ze2XQ6mH3OiTPAwHgTq0Rh5RzXEgtXhuaaxduuS8UCsT9TrlubRQ45S3sFW0/exec";
        
        // Đặt mã mặc định là 12345 cho máy mới
        let userCode = localStorage.getItem('timelog_userCode') || '12345';
        document.getElementById('user-code-span').innerText = userCode;

        let records = JSON.parse(localStorage.getItem('timelog_records')) || {};

        setInterval(() => {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toTimeString().split(' ')[0];
        }, 1000);

        document.getElementById('custom-date').value = new Date().toISOString().split('T')[0];

        function getFormattedDateVN(dateStr) {
            let parts = dateStr.split('-');
            if (parts.length !== 3) return dateStr;
            let d = new Date(parts[0], parts[1] - 1, parts[2]);
            let days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
            return `${days[d.getDay()]}<br>${parts[2]}/${parts[1]}/${parts[0]}`;
        }

        function renderTable() {
            const tbody = document.getElementById('records-table-body');
            tbody.innerHTML = '';
            let total = 0;
            const sortedKeys = Object.keys(records).sort().reverse();

            if (sortedKeys.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-gray-400 text-xs">Chưa có dữ liệu</td></tr>`;
                document.getElementById('total-work-display').innerText = "0 công";
                return;
            }

            sortedKeys.forEach(dateStr => {
                let item = records[dateStr];
                total += parseFloat(item.workType || 0);
                let style = item.isDeleted ? "opacity-40 bg-gray-50 line-through" : "";

                let tr = document.createElement('tr');
                tr.className = `hover:bg-gray-50 ${style}`;
                tr.innerHTML = `
                    <td class="py-2 px-1 font-medium text-gray-800 text-[11px]">${getFormattedDateVN(dateStr)}</td>
                    <td class="py-2 px-1 text-gray-600">${item.checkIn || '--:--'}</td>
                    <td class="py-2 px-1 text-gray-600">${item.checkOut || '--:--'}</td>
                    <td class="py-2 px-1 font-bold text-gray-800">${item.workType}</td>
                    <td class="py-2 px-1 text-center whitespace-nowrap">
                        <button type="button" class="btn-history bg-indigo-100 text-indigo-700 px-1.5 py-1 rounded-md text-[10px] font-bold">📜</button>
                        <button type="button" class="btn-edit bg-amber-500 text-white px-2 py-1 rounded-md text-[10px] font-bold">Sửa</button>
                        <button type="button" class="btn-delete bg-rose-100 text-rose-700 px-1.5 py-1 rounded-md text-[10px] font-bold">❌</button>
                    </td>
                `;

                tr.querySelector('.btn-history').onclick = function() { showHistory(dateStr); };
                tr.querySelector('.btn-edit').onclick = function() { editDay(dateStr); };
                tr.querySelector('.btn-delete').onclick = function() { deleteDay(dateStr); };

                tbody.appendChild(tr);
            });

            document.getElementById('total-work-display').innerText = total + " công";
        }

        function showHistory(dateStr) {
            let item = records[dateStr];
            document.getElementById('modal-date-title').innerText = `Ngày: ${dateStr}`;
            let contentDiv = document.getElementById('modal-history-content');
            contentDiv.innerHTML = '';
            if (item && item.history && item.history.length > 0) {
                item.history.forEach(h => { contentDiv.innerHTML += `<div>• ${h}</div>`; });
            } else {
                contentDiv.innerHTML = `<div class="text-gray-400 italic text-center">Không có lịch sử.</div>`;
            }
            document.getElementById('history-modal').classList.remove('hidden');
        }

        function closeHistoryModal() {
            document.getElementById('history-modal').classList.add('hidden');
        }

        function syncDataToCloud() {
            document.getElementById('cloud-status').innerText = "Đang đồng bộ...";
            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ userCode: userCode, records: records })
            }).then(() => {
                document.getElementById('cloud-status').innerText = "Đã đồng bộ tự động ✓";
            }).catch(() => {
                document.getElementById('cloud-status').innerText = "Lỗi đồng bộ";
            });
        }

        function saveDataAndSync() {
            localStorage.setItem('timelog_records', JSON.stringify(records));
            renderTable();
            syncDataToCloud();
        }

        function quickCheckIn() {
            const now = new Date();
            const dateKey = now.toISOString().split('T')[0];
            const timeStr = now.toTimeString().substring(0, 5);
            const workType = document.getElementById('quick-work-type').value;
            const timestamp = now.toLocaleString('vi-VN');

            if (!records[dateKey]) records[dateKey] = { checkIn: "", checkOut: "", workType: workType, isDeleted: false, history: [] };
            records[dateKey].history.push(`[${timestamp}] Vào làm: ${timeStr}`);
            records[dateKey].checkIn = timeStr;
            records[dateKey].workType = workType;
            records[dateKey].isDeleted = false;

            saveDataAndSync();
            alert(`Đã chấm giờ vào: ${timeStr}`);
        }

        function quickCheckOut() {
            const now = new Date();
            const dateKey = now.toISOString().split('T')[0];
            const timeStr = now.toTimeString().substring(0, 5);
            const timestamp = now.toLocaleString('vi-VN');

            if (!records[dateKey]) records[dateKey] = { checkIn: "08:00", checkOut: "", workType: "1", isDeleted: false, history: [] };
            records[dateKey].history.push(`[${timestamp}] Tan làm: ${timeStr}`);
            records[dateKey].checkOut = timeStr;
            records[dateKey].isDeleted = false;

            saveDataAndSync();
            alert(`Đã chấm giờ về: ${timeStr}`);
        }

        function saveCustomDay() {
            let dateKey = document.getElementById('custom-date').value;
            if (!dateKey) return alert("Vui lòng chọn ngày!");
            let checkIn = document.getElementById('custom-check-in').value;
            let checkOut = document.getElementById('custom-check-out').value;
            let workType = document.getElementById('custom-work-type').value;
            const timestamp = new Date().toLocaleString('vi-VN');

            if (!records[dateKey]) records[dateKey] = { checkIn: "", checkOut: "", workType: "1", isDeleted: false, history: [] };
            records[dateKey].history.push(`[${timestamp}] Cập nhật thủ công: Vào(${checkIn}), Về(${checkOut}), Công(${workType})`);
            records[dateKey].checkIn = checkIn;
            records[dateKey].checkOut = checkOut;
            records[dateKey].workType = workType;
            records[dateKey].isDeleted = false;

            saveDataAndSync();
            alert("Đã lưu thành công!");
        }

        function editDay(dateStr) {
            let item = records[dateStr];
            if (!item) return;
            document.getElementById('custom-date').value = dateStr;
            document.getElementById('custom-check-in').value = item.checkIn || "08:00";
            document.getElementById('custom-check-out').value = item.checkOut || "17:00";
            document.getElementById('custom-work-type').value = item.workType || "1";
            document.getElementById('custom-section').scrollIntoView({ behavior: 'smooth' });
        }

        function deleteDay(dateStr) {
            if (confirm(`Xóa ngày công ${dateStr}?`)) {
                const timestamp = new Date().toLocaleString('vi-VN');
                if (!records[dateStr].history) records[dateStr].history = [];
                records[dateStr].history.push(`[${timestamp}] Đã xóa ngày công`);
                records[dateStr].workType = "0";
                records[dateStr].isDeleted = true;
                saveDataAndSync();
            }
        }

        function changeUserCode() {
            let newCode = prompt("Nhập mã nhân viên của bạn:", userCode);
            if (newCode && newCode.trim() !== "") {
                userCode = newCode.trim();
                localStorage.setItem('timelog_userCode', userCode);
                document.getElementById('user-code-span').innerText = userCode;
                alert("Đã đổi mã! Dữ liệu sẽ được tải theo mã mới.");
                location.reload();
            }
        }

        function exportCSV() {
            let csv = "data:text/csv;charset=utf-8,Ngay,GioVao,GioVe,Cong,TrangThai,LichSu\n";
            for (let date in records) {
                let r = records[date];
                csv += `${date},${r.checkIn},${r.checkOut},${r.workType},${r.isDeleted ? 'Xoa' : 'Dung'},"${(r.history||[]).join(' | ')}"\n`;
            }
            let link = document.createElement("a");
            link.setAttribute("href", encodeURI(csv));
            link.setAttribute("download", "bang_cong.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        renderTable();
    </script>
</body>
</html>
