    <script>
    function updateClock() {
        const now = new Date();
        document.getElementById('liveClock').innerText = now.toLocaleTimeString('vi-VN');
    }
    setInterval(updateClock, 1000);
    updateClock();

    const todayISO = new Date().toISOString().split('T');
    document.getElementById('manualDate').value = todayISO;

    let attendanceData = JSON.parse(localStorage.getItem('dailyAttendance')) || {};
    renderLogs();

    function getDayOfWeek(dateStr) {
        const parts = dateStr.split('/');
        const dateObj = new Date(parts[2], parts[1] - 1, parts[0]);
        const dayIndex = dateObj.getDay();
        const days = ['Chủ Nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];
        return days[dayIndex];
    }

    function stampToday(type) {
        const now = new Date();
        const dateStr = now.toLocaleDateString('vi-VN');
        const timeStr = now.toLocaleTimeString('vi-VN').substring(0, 5);
        const workVal = parseFloat(document.getElementById('todayWorkValue').value);

        if (!attendanceData[dateStr]) {
            attendanceData[dateStr] = { in: '--:--', out: '--:--', val: workVal };
        } else {
            attendanceData[dateStr].val = workVal;
        }

        if (type === 'in') attendanceData[dateStr].in = timeStr;
        if (type === 'out') attendanceData[dateStr].out = timeStr;

        saveAndRefresh();
    }

    function saveManual() {
        const dateInput = document.getElementById('manualDate').value;
        const timeIn = document.getElementById('manualIn').value;
        const timeOut = document.getElementById('manualOut').value;
        const workVal = parseFloat(document.getElementById('manualWorkValue').value);

        if (!dateInput) return alert('Vui lòng chọn ngày!');

        const parts = dateInput.split('-');
        const formattedDate = parts[2] + '/' + parts[1] + '/' + parts[0];

        attendanceData[formattedDate] = {
            in: timeIn || '--:--',
            out: timeOut || '--:--',
            val: workVal
        };

        saveAndRefresh();
        alert('Đã lưu dữ liệu thành công!');
    }

    function editLog(date) {
        const currentData = attendanceData[date];
        if (!currentData) return;

        const modalDiv = document.createElement('div');
        modalDiv.style = "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:flex; justify-content:center; align-items:center; z-index:9999; padding:20px; box-sizing:border-box;";
        
        const currentIn = currentData.in && currentData.in !== '--:--' ? currentData.in : "08:00";
        const currentOut = currentData.out && currentData.out !== '--:--' ? currentData.out : "17:00";
        const currentVal = currentData.val !== undefined ? currentData.val : 1;

        modalDiv.innerHTML = 
            '<div style="background:#fff; width:100%; max-width:320px; padding:20px; border-radius:14px; box-shadow:0 4px 15px rgba(0,0,0,0.2); text-align:left;">' +
                '<h4 style="margin:0 0 15px 0; font-size:16px; text-align:center; color:#1c1c1e;">Sửa công ngày ' + date + '</h4>' +
                '<div style="margin-bottom:12px; display:flex; flex-direction:column; gap:4px;">' +
                    '<label style="font-size:13px; color:#8e8e93;">Giờ Vào:</label>' +
                    '<input type="time" id="editIn" value="' + currentIn + '" style="padding:10px; border:1px solid #c6c6c8; border-radius:8px; font-size:16px; width:100%; box-sizing:border-box;">' +
                '</div>' +
                '<div style="margin-bottom:12px; display:flex; flex-direction:column; gap:4px;">' +
                    '<label style="font-size:13px; color:#8e8e93;">Giờ Về:</label>' +
                    '<input type="time" id="editOut" value="' + currentOut + '" style="padding:10px; border:1px solid #c6c6c8; border-radius:8px; font-size:16px; width:100%; box-sizing:border-box;">' +
                '</div>' +
                '<div style="margin-bottom:20px; display:flex; flex-direction:column; gap:4px;">' +
                    '<label style="font-size:13px; color:#8e8e93;">Số công:</label>' +
                    '<select id="editVal" style="padding:10px; border:1px solid #c6c6c8; border-radius:8px; font-size:16px; width:100%; box-sizing:border-box; background:#fff;">' +
                        '<option value="1"' + (currentVal === 1 ? ' selected' : '') + '>1 công</option>' +
                        '<option value="0.5"' + (currentVal === 0.5 ? ' selected' : '') + '>0.5 công</option>' +
                        '<option value="0"' + (currentVal === 0 ? ' selected' : '') + '>0 công</option>' +
                    </select>' +
                '</div>' +
                '<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">' +
                    '<button id="btnCancelEdit" style="padding:12px; background:#e5e5ea; color:#000; border:none; border-radius:8px; font-weight:600; font-size:14px;">Hủy</button>' +
                    '<button id="btnSaveEdit" style="padding:12px; background:#007aff; color:#fff; border:none; border-radius:8px; font-weight:600; font-size:14px;">Lưu</button>' +
                '</div>' +
            '</div>';

        document.getElementById('btnSaveEdit').onclick = function() {
            const newIn = document.getElementById('editIn').value;
            const newOut = document.getElementById('editOut').value;
            const newVal = parseFloat(document.getElementById('editVal').value);
            attendanceData[date] = { in: newIn || '--:--', out: newOut || '--:--', val: newVal };
            document.body.removeChild(modalDiv);
            saveAndRefresh();
        };
    }
            function deleteLog(date) {
        if (confirm('Xóa dữ liệu ngày ' + date + '?')) {
            delete attendanceData[date];
            saveAndRefresh();
        }
    }

    function saveAndRefresh() {
        localStorage.setItem('dailyAttendance', JSON.stringify(attendanceData));
        renderLogs();
    }

    function renderLogs() {
        const tbody = document.getElementById('logTableBody');
        tbody.innerHTML = '';
        let totalAll = 0;   
        let totalFilter = 0; 

        const fromVal = document.getElementById('filterFrom').value;
        const toVal = document.getElementById('filterTo').value;
        
        let dFrom = null; if (fromVal) { const pF = fromVal.split('-'); dFrom = new Date(pF[0], pF[1] - 1, pF[2]); }
        let dTo = null; if (toVal) { const pT = toVal.split('-'); dTo = new Date(pT[0], pT[1] - 1, pT[2]); }

        if (fromVal && toVal) {
            const pF = fromVal.split('-'); const pT = toVal.split('-');
            document.getElementById('filterText').innerText = 'Tổng công từ ' + pF[2]+'/'+pF[1] + ' đến ' + pT[2]+'/'+pT[1];
            document.getElementById('filterResultBox').style.display = 'block';
        } else {
            document.getElementById('filterResultBox').style.display = 'none';
        }

        const dates = Object.keys(attendanceData).sort((a, b) => {
            const pA = a.split('/'); const pB = b.split('/');
            return new Date(pB[2], pB[1]-1, pB[0]) - new Date(pA[2], pA[1]-1, pA[0]);
        });

        let hasData = false;

        dates.forEach(date => {
            const dayData = attendanceData[date];
            const currentVal = dayData.val !== undefined ? dayData.val : 1;
            totalAll += currentVal; 

            const p = date.split('/');
            const dCurrent = new Date(p[2], p[1] - 1, p[0]);

            if (dFrom && dCurrent < dFrom) return;
            if (dTo && dCurrent > dTo) return;

            hasData = true;
            totalFilter += currentVal; 

            const dayOfWeek = getDayOfWeek(date);

            const row = document.createElement('tr');
            row.innerHTML = '<td><strong>' + dayOfWeek + '</strong><br><span style="font-size:11px;color:#8e8e93;">' + date + '</span></td>' +

                                '</div>' +
                            '</td>';
            tbody.appendChild(row);
        });

        if (!hasData) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty">Không có dữ liệu trong khoảng này</td></tr>';
        }

        document.getElementById('grandTotal').innerText = totalAll;
        document.getElementById('filteredTotal').innerText = totalFilter;
    }

    function exportCSV() {
        const dates = Object.keys(attendanceData);
        if (dates.length === 0) return alert('Chưa có dữ liệu!');
        let csvContent = "\uFEFFThứ,Ngày,Giờ Vào,Giờ Về,Số Công\n";

        link.href = url;
        link.download = "bang_tinh_cong.csv";
