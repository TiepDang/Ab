<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng dụng Chấm công Cá nhân</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-start p-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-lg p-5 mb-4">
        <!-- Header / Trạng thái ngày giờ -->
        <div class="flex justify-between items-center mb-4">
            <span id="current-date-display" class="text-lg font-bold text-gray-800">23 thg 7, 2026</span>
            <span id="worktype-badge" class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-sm font-semibold">1 công</span>
        </div>

        <!-- Giờ Vào / Giờ Về -->
        <div class="grid grid-cols-2 gap-3 mb-4">
            <div>
                <label class="block text-sm font-medium text-gray-500 mb-1">Giờ Vào:</label>
                <input type="time" id="check-in-time" value="08:00" class="w-full bg-gray-50 border border-gray-200 rounded-2xl py-3 px-4 text-center font-bold text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-500 mb-1">Giờ Về:</label>
                <input type="time" id="check-out-time" value="17:00" class="w-full bg-gray-50 border border-gray-200 rounded-2xl py-3 px-4 text-center font-bold text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
        </div>

        <!-- Nút Lưu Ngày Đã Chọn -->
        <button onclick="saveCurrentDay()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-4 rounded-2xl shadow-md transition duration-200">
            Lưu Ngày Đã Chọn
        </button>
    </div>

    <!-- Bộ lọc & Bảng công chi tiết -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-lg p-5">
        <h2 class="text-lg font-bold text-gray-800 mb-3">Bộ lọc & Bảng công chi tiết</h2>
        
        <!-- Các nút lọc -->
        <div class="grid grid-cols-3 gap-2 mb-3">
            <button onclick="filterRecords('thisMonth')" class="bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 rounded-xl text-sm font-medium transition">Tháng này</button>
            <button onclick="filterRecords('lastMonth')" class="bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 rounded-xl text-sm font-medium transition">Tháng trước</button>
            <button onclick="filterRecords('all')" class="bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 rounded-xl text-sm font-medium transition">Tất cả</button>
        </div>

        <!-- Tổng công hiển thị -->
        <div class="bg-emerald-50 border border-emerald-100 rounded-2xl p-3 flex justify-between items-center mb-4">
            <span class="text-sm font-medium text-emerald-800">Tổng công hiển thị:</span>
            <span id="total-work-display" class="text-base font-bold text-emerald-700">0 công</span>
        </div>

        <!-- Bảng danh sách công -->
        <div class="overflow-x-auto mb-4">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-gray-100 text-gray-400 text-xs font-semibold uppercase">
                        <th class="py-2 px-1">Ngày</th>
                        <th class="py-2 px-1">Vào</th>
                        <th class="py-2 px-1">Về</th>
                        <th class="py-2 px-1">Công</th>
                    </tr>
                </thead>
                <tbody id="records-table-body" class="text-sm text-gray-700 divide-y divide-gray-50">
                    <!-- Dữ liệu sẽ được render tự động vào đây -->
                </tbody>
            </table>
        </div>

        <!-- Nút xuất file -->
        <button onclick="exportCSV()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 px-4 rounded-2xl shadow-sm mb-3 transition">
            Xuất file Excel (CSV có Tổng Công)
        </button>

        <!-- Nút mã người dùng / Đồng bộ Cloud -->
        <button onclick="syncDataToCloud()" id="sync-btn" class="w-full bg-slate-600 hover:bg-slate-700 text-white text-xs font-medium py-3 px-4 rounded-2xl shadow-sm text-center transition">
            Mã của bạn: <span id="user-code-span">121221</span> (Bấm để tải lại hoặc tự đặt mã mới)
        </button>
        <p id="cloud-status" class="text-center text-xs text-gray-400 mt-2 italic">Trạng thái Google Sheets: Chưa có dữ liệu trên Cloud</p>
    </div>

    <script>
        // Cấu hình URL Apps Script mới nhất của bạn
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwoZN6H-aO2ThcLXvoSdoN_BJzAjFOshaPzqgk06TJI-xDq8sii85h3TcBt16NjKpwFNw/exec";
        
        let userCode = localStorage.getItem('timelog_userCode') || '121221';
        document.getElementById('user-code-span').innerText = userCode;

        // Lưu trữ dữ liệu mẫu cục bộ (hoặc từ localStorage)
        let records = JSON.parse(localStorage.getItem('timelog_records')) || {
            "2026-07-23": { checkIn: "08:00", checkOut: "13:00", workType: "0.5" },
            "2026-07-19": { checkIn: "08:00", checkOut: "13:00", workType: "0.5" },
            "2026-07-18": { checkIn: "08:00", checkOut: "20:00", workType: "1" },
            "2026-07-17": { checkIn: "09:00", checkOut: "20:00", workType: "1" }
        };

        function renderTable() {
            const tbody = document.getElementById('records-table-body');
            tbody.innerHTML = '';
            let total = 0;

            // Sắp xếp ngày giảm dần
            const sortedKeys = Object.keys(records).sort().reverse();

            sortedKeys.forEach(dateStr => {
                let item = records[dateStr];
                let wType = parseFloat(item.workType || 0);
                total += wType;

                // Format lại ngày hiển thị kiểu tiếng Việt
                let parts = dateStr.split('-');
                let formattedDate = `Ngày ${parts[2]}/${parts[1]}/${parts[0]}`;

                let row = `<tr class="hover:bg-gray-50">
                    <td class="py-2.5 px-1 font-medium text-gray-800 text-xs">${formattedDate}</td>
                    <td class="py-2.5 px-1 text-gray-600">${item.checkIn || '--:--'}</td>
                    <td class="py-2.5 px-1 text-gray-600">${item.checkOut || '--:--'}</td>
                    <td class="py-2.5 px-1 font-bold text-gray-800">${item.workType}</td>
                </tr>`;
                tbody.insertAdjacentHTML('beforeend', row);
            });

            document.getElementById('total-work-display').innerText = total + " công";
        }

        function saveCurrentDay() {
            let dateKey = "2026-07-23"; // Ngày giả lập hiện tại trên giao diện
            let checkIn = document.getElementById('check-in-time').value;
            let checkOut = document.getElementById('check-out-time').value;
            
            records[dateKey] = {
                checkIn: checkIn,
                checkOut: checkOut,
                workType: "1"
            };

            localStorage.setItem('timelog_records', JSON.stringify(records));
            renderTable();
            alert("Đã lưu ngày thành công!");
        }

        function syncDataToCloud() {
            let statusText = document.getElementById('cloud-status');
            statusText.innerText = "Đang đồng bộ lên Cloud...";

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({
                    action: "sync",
                    userCode: userCode,
                    records: records
                })
            }).then(() => {
                statusText.innerText = "Trạng thái Google Sheets: Đã đồng bộ xong ✓";
                alert("Đồng bộ dữ liệu thành công lên Google Sheets!");
            }).catch(err => {
                statusText.innerText = "Trạng thái Google Sheets: Lỗi đồng bộ";
                console.error(err);
            });
        }

        function filterRecords(type) {
            // Tạm thời hiển thị toàn bộ danh sách khi bấm lọc
            renderTable();
        }

        function exportCSV() {
            let csvContent = "data:text/csv;charset=utf-8,Ngay,GioVao,GioVe,Cong\n";
            for (let date in records) {
                let r = records[date];
                csvContent += `${date},${r.checkIn},${r.checkOut},${r.workType}\n`;
            }
            let encodedUri = encodeURI(csvContent);
            let link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "bang_cong_ca_nhan.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Khởi chạy khi tải trang
        renderTable();
    </script>
</body>
</html>
