<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chấm Công Cá Nhân</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f9; padding: 12px; color: #1a1a1a; }
        .container { width: 100%; max-width: 480px; margin: 0 auto; }
        .card { background: white; border-radius: 20px; padding: 18px; margin-bottom: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #edf0f5; width: 100%; overflow: hidden; }
        .title { font-size: 1.3rem; font-weight: 800; text-align: center; color: #0f172a; margin-bottom: 10px; }
        .clock { font-size: 2.4rem; font-weight: 800; text-align: center; color: #0f172a; margin: 10px 0; }
        .stats-box { background-color: #edf5ff; border-radius: 12px; padding: 12px; text-align: center; margin-bottom: 16px; }
        .stats-title { font-size: 0.8rem; font-weight: 700; color: #2563eb; margin-bottom: 4px; }
        .stats-count { font-size: 1.6rem; font-weight: 800; color: #2563eb; }
        .label-text { font-size: 0.8rem; font-weight: 700; color: #64748b; margin-bottom: 6px; text-align: left; display: block; }
        
        select, input { 
            width: 100%; 
            min-width: 0; 
            max-width: 100%;
            padding: 10px 8px; 
            border-radius: 12px; 
            border: 1px solid #e2e8f0; 
            background-color: #f8fafc; 
            font-size: 0.85rem; 
            font-weight: 700; 
            color: #334155; 
            margin-bottom: 14px; 
            outline: none; 
            display: block; 
            -webkit-appearance: none;
        }

        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 5px; }
        button { border: none; padding: 16px; border-radius: 12px; color: white; font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: background 0.2s; }
        button:active { transform: scale(0.98); opacity: 0.9; }
        .btn-in { background-color: #10b981; }
        .btn-out { background-color: #ff4b55; }
        .btn-save { background-color: #5c6bc0; width: 100%; margin-top: 5px; }
        .btn-excel { background-color: #0084ff; width: 100%; margin-top: 5px; font-size: 0.95rem; padding: 14px;}
        
        .quick-filter-row { display: flex; gap: 6px; margin-bottom: 12px; }
        .btn-quick { padding: 8px; font-size: 0.75rem; background-color: #e2e8f0; color: #334155; border-radius: 8px; flex: 1; text-align: center; font-weight: 700; }
        .btn-quick:active { background-color: #cbd5e1; }

        .grid-2 { 
            display: grid; 
            grid-template-columns: repeat(2, minmax(0, 1fr)); 
            gap: 10px; 
            width: 100%; 
        }
        .grid-2 > div { min-width: 0; }
        .grid-2 input, .grid-2 select { width: 100%; margin-bottom: 12px; }

        .footer-id-btn { background-color: #607d8b; width: 100%; margin-top: 12px; font-size: 0.85rem; padding: 12px; color: white; border: none; border-radius: 12px; word-break: break-all; white-space: normal; line-height: 1.4; }
        .table-container { overflow-x: auto; margin-top: 10px; background: #fff; border-radius: 12px; width: 100%; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; min-width: 520px; table-layout: fixed; }
        th, td { padding: 10px 4px; border-bottom: 1px solid #e2e8f0; text-align: center; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        th { color: #64748b; background: #f8fafc; font-weight: 700; }
        th:nth-child(1), td:nth-child(1) { width: 120px; text-align: left; padding-left: 8px; }
        th:nth-child(2), td:nth-child(2) { width: 60px; }
        th:nth-child(3), td:nth-child(3) { width: 60px; }
        th:nth-child(4), td:nth-child(4) { width: 50px; }
        th:nth-child(5), td:nth-child(5) { width: 180px; }

        .action-btn { padding: 6px 8px; font-size: 0.72rem; border-radius: 8px; margin: 0 1px; font-weight: bold; border: none; cursor: pointer; display: inline-block; }
        .btn-edit { background-color: #ff9800; color: white; }
        .btn-history { background-color: #6366f1; color: white; }
        .btn-delete { background-color: #e53935; color: white; }
        
        .network-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: bold; margin-bottom: 10px; }
        .online { background: #d1fae5; color: #065f46; }
        .offline { background: #fee2e2; color: #991b1b; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 9999; padding: 15px; }
        .modal-content { background: white; padding: 20px; border-radius: 20px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); max-height: 85vh; overflow-y: auto; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .btn-close { background-color: #94a3b8; flex: 1; }
        .btn-confirm { background-color: #10b981; flex: 1; }
        .sync-status { font-size: 0.75rem; color: #64748b; margin-top: 4px; font-style: italic; text-align: center; }

        .filter-summary { background-color: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .filter-summary-title { font-size: 0.85rem; font-weight: 700; color: #166534; }
        .filter-summary-value { font-size: 1.1rem; font-weight: 800; color: #15803d; }

        /* Styles chi tiết cho phần Lịch sử chỉnh sửa */
        .history-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-bottom: 12px; font-size: 0.8rem; }
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; border-bottom: 1px solid #cbd5e1; padding-bottom: 4px; }
        .history-time { font-weight: 700; color: #475569; font-size: 0.75rem; }
        .history-action { background: #e0e7ff; color: #3730a3; padding: 2px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; }
        .diff-table { width: 100%; margin-top: 6px; border-collapse: collapse; font-size: 0.75rem; }
        .diff-table th, .diff-table td { padding: 4px 6px; border: 1px solid #e2e8f0; text-align: left; }
        .diff-table th { background-color: #f1f5f9; color: #64748b; }
        .val-old { background-color: #fee2e2; color: #991b1b; text-decoration: line-through; border-radius: 4px; padding: 1px 4px; display: inline-block; }
        .val-new { background-color: #d1fae5; color: #065f46; font-weight: bold; border-radius: 4px; padding: 1px 4px; display: inline-block; }
    </style>
</head>
<body>
<div class="container">
    <!-- CARD 1: Chấm công hôm nay -->
    <div class="card">
        <div id="networkStatus" class="network-badge online">Đang trực tuyến</div>
        <div class="title">Chấm Công Cá Nhân</div>
        <div class="clock" id="liveClock">00:00:00</div>
        <div class="stats-box">
            <div class="stats-title">Tổng công tích lũy (Tất cả)</div>
            <div class="stats-count"><span id="txtTotalCong">0</span> công</div>
        </div>
        <label class="label-text">Chọn loại công hôm nay:</label>
        <select id="selCongHomNay">
            <option value="1">1 công (Ngày làm đủ)</option>
            <option value="0.5">0.5 công (Nửa ngày)</option>
            <option value="0">0 công (Nghỉ lễ/Phép)</option>
        </select>
        <div class="btn-row">
            <button class="btn-in" onclick="chamCongMee('Vào', document.getElementById('selCongHomNay').value)">Vào Làm (Hôm Nay)</button>
            <button class="btn-out" onclick="chamCongMee('Về', document.getElementById('selCongHomNay').value)">Tan Làm (Hôm Nay)</button>
        </div>
    </div>
    
    <!-- CARD 2: Chấm công / Sửa ngày bất kỳ -->
    <div class="card">
        <div class="title" style="font-size: 1.15rem; text-align: left; margin-bottom: 12px;">Chấm công ngày bất kỳ</div>
        <div class="grid-2">
            <div><label class="label-text">Chọn Ngày:</label><input type="date" id="txtBatKyNgay"></div>
            <div>
                <label class="label-text">Tính Công:</label>
                <select id="selBatKyCong"><option value="1">1 công</option><option value="0.5">0.5 công</option><option value="0">0 công</option></select>
            </div>
        </div>
        <div class="grid-2">
            <div><label class="label-text">Giờ Vào:</label><input type="time" id="txtBatKyGioVao" value="08:00"></div>
            <div><label class="label-text">Giờ Về:</label><input type="time" id="txtBatKyGioVe" value="17:00"></div>
        </div>
        <button class="btn-save" onclick="chamCongNgayBatKyMee()">Lưu Ngày Đã Chọn</button>
    </div>

    <!-- CARD 3: Lọc & Bảng công chi tiết -->
    <div class="card">
        <div class="title" style="font-size: 1.15rem; text-align: left; margin-bottom: 12px;">Bộ lọc & Bảng công chi tiết</div>
        
        <div class="quick-filter-row">
            <button class="btn-quick" onclick="setQuickFilter('thisMonth')">Tháng này</button>
            <button class="btn-quick" onclick="setQuickFilter('lastMonth')">Tháng trước</button>
            <button class="btn-quick" onclick="setQuickFilter('all')">Tất cả</button>
        </div>

        <div class="grid-2">
            <div><label class="label-text">Từ ngày:</label><input type="date" id="filterFrom" onchange="renderTable()"></div>
            <div><label class="label-text">Đến ngày:</label><input type="date" id="filterTo" onchange="renderTable()"></div>
        </div>

        <div class="filter-summary">
            <span class="filter-summary-title" id="filterSummaryTitle">Tổng công hiển thị:</span>
            <span class="filter-summary-value"><span id="txtFilterCong">0</span> công</span>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Ngày</th>
                <th>Vào</th>
                <th>Về</th>
                <th>Công</th>
                <th>Hành động</th>
              </tr>
            </thead>
            <tbody id="attendanceTable">
              <!-- Render động -->
            </tbody>
          </table>
        </div>

        <button class="btn-excel" onclick="exportToCSV()">Xuất file Excel (CSV có Tổng Công)</button>
        <button class="footer-id-btn" id="userCodeBtn" onclick="openChangeCodeModal()">Mã của bạn: <span id="displayUserCode">......</span> (Bấm để tải lại hoặc tự đặt mã mới)</button>
        <div class="sync-status" id="syncStatus">Trạng thái Google Sheets: Sẵn sàng</div>
    </div>
</div>

<!-- Modal 1: Sửa Công -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <div class="title" style="font-size: 1.1rem; text-align: left; margin-bottom: 12px;">Sửa công ngày <span id="editDateLabel"></span></div>
    <input type="hidden" id="editDateKey">
    
    <label class="label-text">Tính Công:</label>
    <select id="editWorkType">
      <option value="1">1 công</option>
      <option value="0.5">0.5 công</option>
      <option value="0">0 công</option>
    </select>

    <div class="grid-2">
      <div><label class="label-text">Giờ Vào:</label><input type="time" id="editCheckIn"></div>
      <div><label class="label-text">Giờ Về:</label><input type="time" id="editCheckOut"></div>
    </div>

    <div class="modal-buttons">
      <button class="btn-close" onclick="closeModal('editModal')">Hủy</button>
      <button class="btn-confirm" onclick="saveEdit()">Lưu</button>
    </div>
  </div>
</div>

<!-- Modal 2: Xem Lịch Sử Chỉnh Sửa Chi Tiết -->
<div id="historyModal" class="modal">
  <div class="modal-content">
    <div class="title" style="font-size: 1.1rem; text-align: left; margin-bottom: 12px;">Lịch sử chỉnh sửa <span id="historyDateLabel"></span></div>
    <div id="historyListContainer">
      <!-- Nội dung lịch sử render động ở đây -->
    </div>
    <div class="modal-buttons">
      <button class="btn-close" style="width: 100%;" onclick="closeModal('historyModal')">Đóng</button>
    </div>
  </div>
</div>

<!-- Modal 3: Đổi Mã Sync -->
<div id="codeModal" class="modal">
  <div class="modal-content">
    <div class="title" style="font-size: 1.1rem; text-align: left; margin-bottom: 12px;">Đổi Mã Đồng Bộ</div>
    <label class="label-text">Nhập mã mới của bạn:</label>
    <input type="text" id="newCodeInput" placeholder="Ví dụ: 121221">
    
    <div class="modal-buttons">
      <button class="btn-close" onclick="closeModal('codeModal')">Hủy</button>
      <button class="btn-confirm" onclick="confirmChangeCode()">Đồng ý</button>
    </div>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz7C4JoaAtqqY50e4hOcN2_S1v1UeMyS_ol6hMGajjoluCKpptf0B9maOsSvM5tbe_K/exec";

  let records = JSON.parse(localStorage.getItem('my_attendance_data')) || {};
  
  let userCode = localStorage.getItem('my_user_code');
  if (!userCode) {
    let inputCode = prompt("Vui lòng nhập Mã đồng bộ cá nhân của bạn (ví dụ: SĐT hoặc mã 6 số):");
    userCode = (inputCode && inputCode.trim() !== '') 
      ? inputCode.trim() 
      : Math.floor(100000 + Math.random() * 900000).toString();

    localStorage.setItem('my_user_code', userCode);
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('displayUserCode').innerText = userCode;
    document.getElementById('txtBatKyNgay').value = getTodayStr();
    
    updateClock();
    setInterval(updateClock, 1000);
    
    window.addEventListener('online', () => {
      updateNetworkStatus();
      syncToGoogleSheet();
    });
    window.addEventListener('offline', updateNetworkStatus);
    updateNetworkStatus();

    renderTable();
    loadFromGoogleSheet();

    window.onclick = function(event) {
      if (event.target.classList.contains('modal')) {
        event.target.style.display = 'none';
      }
    };
  });

  function pushHistoryLog(date, actionName, oldVal, newVal) {
    if (!records[date]) return;
    if (!records[date].history) {
      records[date].history = [];
    }

    const now = new Date();
    const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')} - ${now.getDate().toString().padStart(2, '0')}/${(now.getMonth()+1).toString().padStart(2, '0')}/${now.getFullYear()}`;

    records[date].history.unshift({
      time: timeStr,
      action: actionName,
      oldVal: oldVal ? { checkIn: oldVal.checkIn || '--:--', checkOut: oldVal.checkOut || '--:--', workType: oldVal.workType || '0' } : null,
      newVal: { checkIn: newVal.checkIn || '--:--', checkOut: newVal.checkOut || '--:--', workType: newVal.workType || '0' }
    });
  }

  async function syncToGoogleSheet() {
    const statusText = document.getElementById('syncStatus');
    if (!navigator.onLine) {
      statusText.innerText = "Trạng thái Google Sheets: Đang ngoại tuyến (Đã lưu máy)";
      return;
    }

    statusText.innerText = "Trạng thái Google Sheets: Đang đồng bộ...";

    try {
      let response = await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "sync",
          userCode: userCode,
          records: records
        })
      });

      let result = await response.json();
      if(result.status === "success") {
        statusText.innerText = "Trạng thái Google Sheets: Đã đồng bộ xong ✓";
      } else {
        statusText.innerText = "Trạng thái Google Sheets: Lỗi đồng bộ";
      }
    } catch (err) {
      console.error(err);
      statusText.innerText = "Trạng thái Google Sheets: Lỗi kết nối (Đã lưu máy)";
    }
  }

  async function loadFromGoogleSheet() {
    const statusText = document.getElementById('syncStatus');
    if (!navigator.onLine) {
      statusText.innerText = "Trạng thái Google Sheets: Đang ngoại tuyến (Chế độ lưu máy)";
      return;
    }

    statusText.innerText = "Trạng thái Google Sheets: Đang tải dữ liệu...";

    try {
      let response = await fetch(`${SCRIPT_URL}?userCode=${userCode}`);
      let cloudData = await response.json();

      if (cloudData && Object.keys(cloudData).length > 0) {
        records = cloudData;
        localStorage.setItem('my_attendance_data', JSON.stringify(records));
        renderTable();
        statusText.innerText = "Trạng thái Google Sheets: Đã cập nhật từ Cloud ✓";
      } else {
        statusText.innerText = "Trạng thái Google Sheets: Chưa có dữ liệu trên Cloud";
      }
    } catch (err) {
      console.error(err);
      statusText.innerText = "Trạng thái Google Sheets: Không thể tải từ Cloud";
    }
  }

  function saveAndSync() {
    localStorage.setItem('my_attendance_data', JSON.stringify(records));
    renderTable();
    syncToGoogleSheet();
  }

  function updateClock() {
    const now = new Date();
    document.getElementById('liveClock').innerText = now.toTimeString().split(' ')[0];
  }

  function updateNetworkStatus() {
    const badge = document.getElementById('networkStatus');
    if (navigator.onLine) {
      badge.className = 'network-badge online';
      badge.innerText = 'Đang trực tuyến';
    } else {
      badge.className = 'network-badge offline';
      badge.innerText = 'Đang ngoại tuyến (Offline)';
    }
  }

  function getTodayStr() {
    const d = new Date();
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function chamCongMee(type, workType) {
    const today = getTodayStr();
    const timeNow = new Date().toTimeString().substring(0, 5);

    const oldVal = records[today] ? JSON.parse(JSON.stringify(records[today])) : null;

    if (!records[today]) {
      records[today] = { checkIn: '', checkOut: '', workType: workType, history: [] };
    }

    if (type === 'Vào') {
      records[today].checkIn = timeNow;
      records[today].workType = workType;
      pushHistoryLog(today, "Vào làm (Hôm nay)", oldVal, records[today]);
      alert(`Đã ghi nhận VÀO LÀM lúc ${timeNow}`);
    } else if (type === 'Về') {
      records[today].checkOut = timeNow;
      records[today].workType = workType;
      pushHistoryLog(today, "Tan làm (Hôm nay)", oldVal, records[today]);
      alert(`Đã ghi nhận TAN LÀM lúc ${timeNow}`);
    }

    saveAndSync();
  }

  function chamCongNgayBatKyMee() {
    const date = document.getElementById('txtBatKyNgay').value;
    if (!date) return alert('Vui lòng chọn ngày!');

    const workType = document.getElementById('selBatKyCong').value;
    const checkIn = document.getElementById('txtBatKyGioVao').value;
    const checkOut = document.getElementById('txtBatKyGioVe').value;

    const oldVal = records[date] ? JSON.parse(JSON.stringify(records[date])) : null;
    const currentHistory = records[date] ? (records[date].history || []) : [];

    records[date] = { checkIn, checkOut, workType, history: currentHistory };
    pushHistoryLog(date, oldVal ? "Cập nhật ngày chọn" : "Tạo mới ngày chọn", oldVal, records[date]);

    saveAndSync();
    alert(`Đã lưu công ngày ${formatDateVi(date)}!`);
  }

  function setQuickFilter(mode) {
    const now = new Date();
    const y = now.getFullYear();
    
    if (mode === 'thisMonth') {
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const lastDay = new Date(y, now.getMonth() + 1, 0).getDate();
      document.getElementById('filterFrom').value = `${y}-${m}-01`;
      document.getElementById('filterTo').value = `${y}-${m}-${String(lastDay).padStart(2, '0')}`;
    } else if (mode === 'lastMonth') {
      const prevMonthDate = new Date(y, now.getMonth() - 1, 1);
      const prevY = prevMonthDate.getFullYear();
      const prevM = String(prevMonthDate.getMonth() + 1).padStart(2, '0');
      const lastDay = new Date(prevY, prevMonthDate.getMonth() + 1, 0).getDate();
      document.getElementById('filterFrom').value = `${prevY}-${prevM}-01`;
      document.getElementById('filterTo').value = `${prevY}-${prevM}-${String(lastDay).padStart(2, '0')}`;
    } else if (mode === 'all') {
      document.getElementById('filterFrom').value = '';
      document.getElementById('filterTo').value = '';
    }
    renderTable();
  }

  function renderTable() {
    const tbody = document.getElementById('attendanceTable');
    tbody.innerHTML = '';

    const from = document.getElementById('filterFrom').value;
    const to = document.getElementById('filterTo').value;

    let totalCongTatCa = 0;
    let totalCongBoLoc = 0;
    let countNgayBoLoc = 0;

    const sortedDates = Object.keys(records).sort().reverse();

    sortedDates.forEach(date => {
      const item = records[date];
      const congVal = parseFloat(item.workType || 0);
      
      const isEmptyRecord = !item.checkIn && !item.checkOut && congVal === 0;

      if (isEmptyRecord && (!item.history || item.history.length === 0)) {
        delete records[date];
        return;
      }

      totalCongTatCa += congVal;

      if (from && date < from) return;
      if (to && date > to) return;

      totalCongBoLoc += congVal;
      countNgayBoLoc++;

      const tr = document.createElement('tr');
      
      if (isEmptyRecord) {
        tr.style.backgroundColor = "#fafafa";
        tr.innerHTML = `
          <td style="color: #94a3b8; text-decoration: line-through;">${formatDateVi(date)}</td>
          <td colspan="3" style="color: #94a3b8; font-style: italic;">Đã xóa dữ liệu</td>
          <td>
            <button class="action-btn btn-history" onclick="openHistoryModal('${date}')">Lịch sử</button>
          </td>
        `;
      } else {
        tr.innerHTML = `
          <td>${formatDateVi(date)}</td>
          <td>${item.checkIn || '--:--'}</td>
          <td>${item.checkOut || '--:--'}</td>
          <td><b>${item.workType}</b></td>
          <td>
            <button class="action-btn btn-edit" onclick="openEditModal('${date}')">Sửa</button>
            <button class="action-btn btn-history" onclick="openHistoryModal('${date}')">Lịch sử</button>
            <button class="action-btn btn-delete" onclick="deleteRecord('${date}')">Xóa</button>
          </td>
        `;
      }
      tbody.appendChild(tr);
    });

    document.getElementById('txtTotalCong').innerText = totalCongTatCa;
    document.getElementById('txtFilterCong').innerText = totalCongBoLoc;

    const summaryTitle = document.getElementById('filterSummaryTitle');
    if (from || to) {
      summaryTitle.innerText = `Tổng công lọc (${countNgayBoLoc} ngày hiển thị):`;
    } else {
      summaryTitle.innerText = "Tổng công hiển thị:";
    }
  }

  function formatDateVi(dateStr) {
    const [y, m, d] = dateStr.split('-');
    const dateObj = new Date(y, m - 1, d);
    const days = ['CN', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];
    return `${days[dateObj.getDay()]} ${d}/${m}/${y}`;
  }

  // Cập nhật hàm xóa: Giữ lại lịch sử thay vì xóa mất tích
  function deleteRecord(date) {
    if (confirm(`Bạn có chắc chắn muốn xóa dữ liệu chấm công ngày ${formatDateVi(date)}? (Lịch sử chỉnh sửa vẫn sẽ được giữ lại)`)) {
      const oldVal = records[date] ? JSON.parse(JSON.stringify(records[date])) : null;
      const currentHistory = records[date] ? (records[date].history || []) : [];
      
      records[date] = {
        checkIn: "",
        checkOut: "",
        workType: "0",
        history: currentHistory
      };

      pushHistoryLog(date, "Xóa dữ liệu ngày", oldVal, records[date]);
      saveAndSync();
    }
  }

  function openEditModal(date) {
    const item = records[date];
    document.getElementById('editDateKey').value = date;
    document.getElementById('editDateLabel').innerText = formatDateVi(date);
    document.getElementById('editWorkType').value = item.workType || '1';
    document.getElementById('editCheckIn').value = item.checkIn || '08:00';
    document.getElementById('editCheckOut').value = item.checkOut || '17:00';
    document.getElementById('editModal').style.display = 'flex';
  }

  function saveEdit() {
    const date = document.getElementById('editDateKey').value;
    const oldVal = records[date] ? JSON.parse(JSON.stringify(records[date])) : null;
    const currentHistory = records[date] ? (records[date].history || []) : [];

    records[date] = {
      workType: document.getElementById('editWorkType').value,
      checkIn: document.getElementById('editCheckIn').value,
      checkOut: document.getElementById('editCheckOut').value,
      history: currentHistory
    };

    pushHistoryLog(date, "Sửa thủ công", oldVal, records[date]);

    closeModal('editModal');
    saveAndSync();
  }

  function openHistoryModal(date) {
    document.getElementById('historyDateLabel').innerText = formatDateVi(date);
    const container = document.getElementById('historyListContainer');
    container.innerHTML = '';

    const item = records[date];
    const history = (item && item.history) ? item.history : [];

    if (history.length === 0) {
      container.innerHTML = '<div style="text-align: center; color: #64748b; padding: 20px 0;">Chưa có lịch sử thay đổi cho ngày này.</div>';
    } else {
      history.forEach(log => {
        const card = document.createElement('div');
        card.className = 'history-card';
        
        let diffHtml = '';
        if (log.action.includes("Xóa")) {
          diffHtml = `<div style="margin-top: 4px; color: #e53935; font-weight: bold;">Đã xóa sạch dữ liệu chấm công và reset về 0 công.</div>`;
        } else if (log.oldVal) {
          diffHtml = `
            <table class="diff-table">
              <thead>
                <tr>
                  <th>Thông tin</th>
                  <th>Trước khi sửa</th>
                  <th>Sau khi sửa</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><b>Giờ Vào</b></td>
                  <td><span class="val-old">${log.oldVal.checkIn}</span></td>
                  <td><span class="val-new">${log.newVal.checkIn}</span></td>
                </tr>
                <tr>
                  <td><b>Giờ Về</b></td>
                  <td><span class="val-old">${log.oldVal.checkOut}</span></td>
                  <td><span class="val-new">${log.newVal.checkOut}</span></td>
                </tr>
                <tr>
                  <td><b>Tính Công</b></td>
                  <td><span class="val-old">${log.oldVal.workType} công</span></td>
                  <td><span class="val-new">${log.newVal.workType} công</span></td>
                </tr>
              </tbody>
            </table>
          `;
        } else {
          diffHtml = `
            <div style="margin-top: 4px;"><b>Giá trị ghi nhận:</b> Vào ${log.newVal.checkIn} | Về ${log.newVal.checkOut} | Công ${log.newVal.workType}</div>
          `;
        }

        card.innerHTML = `
          <div class="history-header">
            <span class="history-time">${log.time}</span>
            <span class="history-action">${log.action}</span>
          </div>
          ${diffHtml}
        `;
        container.appendChild(card);
      });
    }

    document.getElementById('historyModal').style.display = 'flex';
  }

  function openChangeCodeModal() {
    document.getElementById('newCodeInput').value = userCode;
    document.getElementById('codeModal').style.display = 'flex';
  }

  function confirmChangeCode() {
    const val = document.getElementById('newCodeInput').value.trim();
    if (val) {
      userCode = val;
      localStorage.setItem('my_user_code', userCode);
      document.getElementById('displayUserCode').innerText = userCode;
      closeModal('codeModal');
      loadFromGoogleSheet();
    }
  }

  function closeModal(modalId) {
    document.getElementById(modalId).style.display = 'none';
  }

  function exportToCSV() {
    const from = document.getElementById('filterFrom').value;
    const to = document.getElementById('filterTo').value;

    let csv = "\uFEFFNgày,Giờ Vào,Giờ Về,Công\n";
    const sortedDates = Object.keys(records).sort();

    let tongCongXuat = 0;

    sortedDates.forEach(date => {
      if (from && date < from) return;
      if (to && date > to) return;

      const item = records[date];
      const congVal = parseFloat(item.workType || 0);
      
      // Không xuất các dòng đã xóa (0 công, không có giờ) ra file Excel
      if (!item.checkIn && !item.checkOut && congVal === 0) return;

      tongCongXuat += congVal;

      csv += `"${formatDateVi(date)}","${item.checkIn || ''}","${item.checkOut || ''}","${congVal}"\n`;
    });

    csv += `"TỔNG CÔNG","","","${tongCongXuat}"\n`;

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    
    let fileName = `Bang_Cong_${getTodayStr()}.csv`;
    if (from || to) {
      fileName = `Bang_Cong_Tu_${from || 'dau'}_den_${to || 'nay'}.csv`;
    }

    link.setAttribute("download", fileName);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
</script>
